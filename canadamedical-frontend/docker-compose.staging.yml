# ─────────────────────────────────────────────────────────────────────────────
# Staging Docker Compose — CanadianMedProject frontend
#
# Deploys the React SPA on its own, separate from the backend stack. Serves on
# port 80 of the VPS:
#
#   http://VPS_IP        → this frontend
#   http://VPS_IP:8001   → the backend API (deployed from the backend repo)
#
# VITE_API_URL and VITE_WS_URL are build args: Vite inlines them into the
# bundle at build time, so in Coolify they must be marked "Available at
# Buildtime". Setting them as runtime-only variables silently produces a blank
# page, because src/lib/api.ts throws on boot when VITE_API_URL is missing.
#
# They must also match the scheme the page is served over — http/ws here, not
# https/wss, since there is no TLS in front of this deployment yet.
# ─────────────────────────────────────────────────────────────────────────────

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
