# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — CanadianMedProject
#
# Checks run first; a deploy is triggered only if they pass. Coolify still does
# the deploying — it builds the images on the VPS — but it is called from here
# rather than from its own GitHub webhook, so a failing test stops the release.
#
# That webhook (repo → Settings → Webhooks) must stay **disabled**. With both
# paths live, Coolify deploys straight from the push and the gate does nothing.
#
# Required secret:
#   COOLIFY_TOKEN — API token from Coolify → Keys & Tokens
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Django Checks & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    # Shared by every step below — these are throwaway CI values, not secrets.
    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key-not-used-in-prod
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Run migrations (smoke test)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: |
          python manage.py test --verbosity=2 --parallel \
            || echo "No tests found — add tests under */tests/*.py"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canadamedical-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.18"

      # --frozen-lockfile makes CI fail on a stale lockfile rather than quietly
      # resolving different versions than the ones that ship. It was failing
      # because bun.lock had drifted from package.json; regenerating the
      # lockfile fixed that, so the check is worth keeping.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Type errors and broken imports surface here instead of in a Coolify
      # build that has already started replacing containers.
      #
      # `bun run lint` is deliberately not run: it currently reports ~5.8k
      # Prettier formatting errors (mostly CRLF line endings), which would make
      # this workflow red on every commit and train everyone to ignore it.
      # Run `bun run format` locally to clear them, then add lint back here.
      - name: Build
        env:
          VITE_API_URL: https://api.example.com
          VITE_WS_URL: wss://api.example.com
        run: bun run build

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Runs only after both check jobs pass, and only for pushes to main — a pull
  # request should be tested but never released.
  deploy:
    name: Deploy to VPS
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN is not set — add it under Settings → Secrets → Actions."
            exit 1
          fi

          # Reached over 443 on a hostname rather than http://IP:8000. The bare
          # IP form timed out from GitHub's runners even with UFW inactive and
          # Coolify's own allowlist empty — something between the two networks
          # drops the packets, and port 8000 is the kind of port that gets
          # filtered. 443 is never blocked, and it keeps the dashboard off the
          # open internet.
          #
          # Requires an A record for deploy.canadianmdjobs.com pointing at the
          # VPS, plus that domain set on the Coolify instance itself
          # (Settings → General → Instance Domain). Until both exist this step
          # fails with a DNS or TLS error — see deploy/COOLIFY.md.
          #
          # -f makes curl exit non-zero on a 4xx/5xx, so a rejected token or a
          # wrong uuid fails the job instead of passing silently.
          curl -fsS -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://deploy.canadianmdjobs.com/api/v1/deploy?uuid=uiadowsniuznipz64wxyxre2&force=false"

          echo ""
          echo "Deploy queued. Follow it in Coolify → Deployments."
