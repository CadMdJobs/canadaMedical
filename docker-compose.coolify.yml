# ─────────────────────────────────────────────────────────────────────────────
# Coolify Docker Compose — CanadianMedProject
#
# Differences from docker-compose.prod.yml (host-Nginx variant):
#   - No `ports:` bindings. Coolify's Traefik reaches containers over the
#     Docker network, so loopback publishing would hide the services from it.
#   - Images are built on the VPS from the repo instead of pulled from GHCR.
#   - TLS, certificates and routing are handled by Coolify — no host Nginx,
#     no Certbot, no deploy/nginx-host.conf.
#   - pgbouncer userlist.txt is generated at boot from DB_USER/DB_PASSWORD so
#     there is no secret file to upload by hand.
#
# In Coolify:
#   1. New Resource → Docker Compose → point at this file
#   2. Set the domain on `frontend` (https://YOUR_DOMAIN) and on `backend`
#      (https://api.YOUR_DOMAIN)
#   3. Add the environment variables listed in .env.production.template.
#      VITE_API_URL and VITE_WS_URL MUST be marked as *Build Variables*.
# ─────────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DB_HOST: pgbouncer
    DB_PORT: 5432
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    FRONTEND_URL: ${FRONTEND_URL}
    CORS_EXTRA_ORIGIN: ${CORS_EXTRA_ORIGIN:-}
    SECURE_SSL: ${SECURE_SSL:-True}
    DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
    DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    RESEND_TEST_EMAIL: ${RESEND_TEST_EMAIL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ca-central-1}
    LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=10MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - wal_buffers=8MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── pgBouncer — connection pooler ────────────────────────────────────────────
  # No mounted pgbouncer.ini / userlist.txt here: both are generated at startup
  # from DB_USER and DB_PASSWORD. That keeps the md5 hash in sync with the env
  # vars automatically and removes the "upload a secret file to the VPS" step,
  # which Coolify has no clean way to do.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      AUTH_TYPE: scram-sha-256
      # Django's psycopg2 sends these on connect; pgBouncer rejects unknown
      # startup params in transaction mode unless they are ignored.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Config passed as flags for the same reason as the db service above.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --databases
      - "2"
      - --save
      - "900 1"
      - --tcp-keepalive
      - "60"
      - --timeout
      - "300"
      - --loglevel
      - notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Django / Daphne (web) ────────────────────────────────────────────────────
  # Traefik routes api.YOUR_DOMAIN here. `expose` (not `ports`) keeps the
  # service on the Docker network where Coolify's proxy can see it.
  backend:
    <<: *backend-common
    expose:
      - "8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - backend_logs:/app/logs
    command: ["daphne"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - backend
      - proxy

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    <<: *backend-common
    volumes:
      - media_files:/app/media
      - backend_logs:/app/logs
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL",
        "celery -A core inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

  # ── Celery Beat (scheduler) — must stay a singleton ──────────────────────────
  celery-beat:
    <<: *backend-common
    volumes:
      - backend_logs:/app/logs
    command: ["beat"]
    # Beat is a scheduler with no socket to probe, but the image carries a
    # HEALTHCHECK that curls localhost:8000 — nothing listens there in this
    # container, so it would sit permanently unhealthy. Disable, don't fake it.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # ── React / Nginx (frontend) ─────────────────────────────────────────────────
  # VITE_* are build args: Vite inlines them into the bundle at build time, so
  # they must be set as Build Variables in Coolify, not plain env vars.
  frontend:
    build:
      context: ./canadamedical-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Shell form with -O- behaves the same under busybox and GNU wget; the
      # exec form left the container unhealthy while serving traffic fine.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
  # Coolify attaches its Traefik proxy to this network to route the domains.
  proxy:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  backend_logs:
    driver: local
