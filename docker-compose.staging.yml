# ─────────────────────────────────────────────────────────────────────────────
# Staging / no-domain Docker Compose — CanadianMedProject
#
# For running on a bare VPS IP before a domain exists. Everything is served
# over plain HTTP on published ports:
#
#   http://VPS_IP        → frontend (React SPA)
#   http://VPS_IP:8001   → backend  (Django API + WebSocket)
#
# Why this file exists separately from docker-compose.coolify.yml:
#   Traefik routes by hostname. With no domain there is no hostname to match,
#   so the containers publish ports directly instead of going through the
#   proxy. Once a domain is available, switch to docker-compose.coolify.yml —
#   it drops these ports and lets Coolify terminate TLS.
#
# ⚠️ This is HTTP only. Passwords and JWTs travel unencrypted, so treat it as a
#    demo/staging environment: do not put real physician or payment data in it.
#
# In Coolify: New Resource → Docker Compose → this file, set no domains.
# See deploy/COOLIFY.md for the environment variables.
# ─────────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DB_HOST: pgbouncer
    DB_PORT: 5432
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    FRONTEND_URL: ${FRONTEND_URL}
    CORS_EXTRA_ORIGIN: ${CORS_EXTRA_ORIGIN:-}
    # Must stay False here: there is no TLS in front, so SECURE_SSL_REDIRECT
    # would bounce every request into an https:// URL that nothing serves.
    SECURE_SSL: "False"
    DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
    DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    STRIPE_CURRENCY: ${STRIPE_CURRENCY:-cad}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    RESEND_TEST_EMAIL: ${RESEND_TEST_EMAIL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ca-central-1}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  # Tuning is passed as -c flags rather than by mounting
  # deploy/postgres/postgresql.conf. Coolify copies the compose file into
  # /artifacts/<id>/ before running it, and a relative bind mount that does not
  # resolve there is silently created as an empty *directory*, which makes
  # postgres exit immediately — the container died about a second after start,
  # well inside its 30s healthcheck grace period, so it was never a healthcheck
  # problem. Flags carry the same settings with nothing to resolve.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=10MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - wal_buffers=8MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── pgBouncer — connection pooler ────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      # postgres:16 hashes passwords with scram-sha-256 by default, so asking
      # pgBouncer for md5 makes every login fail against it. The healthcheck
      # below could not catch that: pg_isready only proves the port answers,
      # not that credentials work, which is why pgbouncer reported healthy
      # while the backend timed out connecting through it for 60s at a time.
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Config passed as flags for the same reason as the db service above: the
  # mounted redis.conf would be the next thing to fail once postgres started.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --databases
      - "2"
      - --save
      - "900 1"
      - --tcp-keepalive
      - "60"
      - --timeout
      - "300"
      - --loglevel
      - notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Django / Daphne (web) ────────────────────────────────────────────────────
  # Published on 0.0.0.0 so the API is reachable at http://VPS_IP:8001
  # Host port is 8001, not 8000: Coolify's own dashboard occupies 8000 on this
  # VPS. Inside the container Daphne still listens on 8000.
  backend:
    <<: *backend-common
    ports:
      - "8001:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - backend_logs:/app/logs
    command: ["daphne"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    <<: *backend-common
    volumes:
      - media_files:/app/media
      - backend_logs:/app/logs
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL",
        "celery -A core inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

  # ── Celery Beat (scheduler) — must stay a singleton ──────────────────────────
  celery-beat:
    <<: *backend-common
    volumes:
      - backend_logs:/app/logs
    command: ["beat"]
    # Beat is a scheduler with no socket to probe, but the image carries a
    # HEALTHCHECK that curls localhost:8000 — nothing listens there in this
    # container, so it was permanently unhealthy. Disable rather than fake it.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # ── React / Nginx (frontend) ─────────────────────────────────────────────────
  # Served on port 80 → http://VPS_IP
  #
  # The SPA lives in this repository under canadamedical-frontend/. There is no
  # separate frontend repo for this project — CadMdJobs/canadaMedicalFrontend is
  # an unrelated pediatric-clinic app that happens to have a similar name.
  #
  # VITE_* are build args baked into the bundle, so they must use the same
  # scheme the browser does: http://VPS_IP:8001, not https://.
  frontend:
    build:
      context: ./canadamedical-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    ports:
      # Host port 3000, not 80: Coolify's own Traefik proxy already holds 80 on
      # this VPS, so binding it here fails with "port is already allocated".
      # Nginx still listens on 80 inside the container.
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /healthz answers 200 from outside, so the endpoint is fine. Using the
      # shell form and -O- keeps this working across busybox and GNU wget,
      # whose flag handling differs.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  backend_logs:
    driver: local
